<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Task List</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main>
    <h1>My Task List</h1>
    <p>A simple project to practise using Git.</p>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="Write a task" aria-label="New task" required>
      <button type="submit">Add</button>
    </form>
    <ul id="task-list" aria-live="polite"></ul>
  </main>
  <script src="src/script.js"></script>
</body>
</html>
